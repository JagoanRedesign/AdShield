name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan proyek (otomatis extract zip jika ada)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            ZIP=$(ls *.zip | head -n 1)
            mkdir -p _proj && unzip -q "$ZIP" -d _proj
            ROOT=$(dirname "$(find _proj -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$ROOT" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AdShield-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
